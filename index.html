<!DOCTYPE html><html lang="en"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Redirecting…</title><script>(function(){const fallbackLocale = "en";
const localeRedirectMap = {"en":"en","en-us":"en","en-gb":"en","ru":"ru","ru-ru":"ru"};

      (function () {
        if (typeof window === 'undefined') return;

        var fallback = fallbackLocale;
        var localeMap = localeRedirectMap;

        var languages = (navigator.languages || [navigator.language || '']).map(function (entry) {
          return (entry || '').toLowerCase();
        });

        var target = null;
        for (var i = 0; i < languages.length; i++) {
          var lang = languages[i];
          if (localeMap[lang]) {
            target = localeMap[lang];
            break;
          }
          var short = lang.split('-')[0];
          if (localeMap[short]) {
            target = localeMap[short];
            break;
          }
        }

        if (!target) {
          target = fallback;
        }
        var currentUrl = window.location.href;
        if(currentUrl.endsWith('/')) {
          currentUrl = currentUrl.slice(0, -1);
        }
        var destination = currentUrl + '/' + target + '/';
        if (window.location.pathname !== destination) {
          window.location.replace(destination);
        }
      })();
